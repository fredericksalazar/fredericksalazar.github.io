name: Ingest Observatorio Económico

on:
  schedule:
    # Días 5, 10, 15, 20, 25 a las 13:00 UTC (8am Bogotá).
    # DANE publica IPC entre días 5-9 del mes siguiente; BanRep tasa fin de mes.
    # Múltiples corridas garantizan capturar publicaciones tardías; el commit
    # solo ocurre si hay diff real en el JSON.
    - cron: '0 13 5,10,15,20,25 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ingest-observatorio
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run pipeline
        id: run
        run: python -m ingestion.main --verbose

      - name: Run tests
        run: pytest ingestion/tests/ -v

      - name: Detect changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en datos."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --staged --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ULTIMO=$(python -c "import json; print(json.load(open('public/data/data_inflacion.json'))['metadata']['cobertura']['ultimo_periodo'])")
          git commit -m "data: actualización observatorio económico ($ULTIMO)"
          git push

      - name: Build site (only if data changed)
        if: steps.changes.outputs.has_changes == 'true'
        uses: withastro/action@v3
        with:
          node-version: 22

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline de ingesta falló — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `El workflow **Ingest Observatorio Económico** falló en \`${context.sha.slice(0,7)}\`.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Posibles causas:`,
              `- DANE cambió la URL o estructura del XLSX.`,
              `- Endpoint SDMX BanRep no respondió.`,
              `- Validaciones de tests rotas.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ingest']
            });

  deploy:
    needs: ingest
    if: needs.ingest.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
