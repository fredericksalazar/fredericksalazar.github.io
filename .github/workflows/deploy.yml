name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deployments corran a la vez (p. ej. dos pushes seguidos o
# push + workflow_dispatch): el segundo espera al primero en vez de chocar
# contra el backend de Pages y fallar con "Deployment failed, try again later".
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22 # <-- Esta es la línea mágica que soluciona el error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Notifica a Bing/Yandex (IndexNow) que el sitio se actualizó. Se ejecuta
      # tras el deploy y lee el sitemap ya publicado (sin dist/, el script hace
      # fetch del sitemap en vivo). `continue-on-error` evita que un fallo del
      # ping marque el deploy como fallido.
      - name: Checkout (para el script de IndexNow)
        uses: actions/checkout@v4
      - name: Ping IndexNow (Bing/Yandex)
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs
